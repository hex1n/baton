profile: python-service
description: Portable profile for Python services using pytest
repo_signals:
  - pyproject.toml
  - requirements.txt
  - pytest.ini
verification_style:
  primary: targeted pytest
  secondary: lint and type checks
workspace_strategy:
  preferred: git worktree
  fallback: feature branch in current workspace
high_risk_surfaces:
  - migrations
  - alembic
  - settings
  - background jobs
preferred_test_style:
  first_layer: pytest unit tests
  second_layer: service or db integration tests
required_gates:
  - scoped_explorer
  - architecture_approved
  - verification_path_check
example_commands:
  discover:
    - rg --files -g pyproject.toml -g requirements.txt
    - pytest --version
  verify:
    - pytest <path>
    - python -m compileall <package>
notes:
  - pin the active environment before implementation
  - verify fixture availability early
