repo_name: __REPO_NAME__
base_profile: __BASE_PROFILE__
adapter: __ADAPTER__

documentation:
  # artifact_language: auto | en | zh
  # auto means bootstrap scripts resolve from locale; writing skills follow
  # the current user request language.
  artifact_language: __ARTIFACT_LANGUAGE__
  control_plane_language: en

workspace:
  worktree_required_for_medium_plus: true
  worktree_root: .worktrees
  artifacts_live_in_primary_repo: true

execution:
  verification_isolation_mode: strict
  review_isolation_mode: strict
  max_eval_rounds: 3

verification:
  build_command: __BUILD_COMMAND__
  test_command: __TEST_COMMAND__
  optional_static_checks:
    - __OPTIONAL_STATIC_CHECK__
  dry_run_required_before_generator: true

risk:
  high_risk_paths:
    - __HIGH_RISK_PATH_1__
  environment_sensitive_paths:
    - __HIGH_RISK_PATH_2__

notes:
  - __REPO_NOTE__
